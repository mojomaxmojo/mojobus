# ============================================
# Optimized Nginx Configuration for MojoBus (mojobus.co)
# React SPA with Vite Build - Intelligent Caching + Brotli
# ============================================

server {
   listen   80;
   server_name mojobus.co www.mojobus.co;
   return 302 https://mojobus.co$request_uri;
   root /home/nginx/domains/mojobus.co/public;
   include /usr/local/nginx/conf/staticfiles.conf;
}

server {
  listen 443 ssl;
  http2 on;

  server_name mojobus.co www.mojobus.co;

  include /usr/local/nginx/conf/ssl/mojobus.co/mojobus.co.crt.key.conf;
  include /usr/local/nginx/conf/ssl_include.conf;

  # Große Uploads auf Server-Level (gilt für alle locations)
  # Muss hier stehen – location-level reicht nicht immer
  client_max_body_size 100m;

  # Cloudflare authenticated origin pull cert (optional)
  #ssl_client_certificate /usr/local/nginx/conf/ssl/cloudflare/test.mojobus.co/origin.crt;
  #ssl_verify_client on;

  # Mozilla recommended SSL ciphers
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers   on;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  ssl_buffer_size 1369;
  ssl_session_tickets on;

  # Enable OCSP stapling
  resolver 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 valid=10m;
  resolver_timeout 10s;
  ssl_stapling off;
  ssl_stapling_verify off;

  # Disable ngx_pagespeed (not used)
  #include /usr/local/nginx/conf/pagespeed.conf;
  #include /usr/local/nginx/conf/pagespeedhandler.conf;
  #include /usr/local/nginx/conf/pagespeedstatslog.conf;

  # Logging
  access_log /home/nginx/domains/mojobus.co/log/access.log combined buffer=256k flush=5m;
  error_log /home/nginx/domains/mojobus.co/log/error.log;

  include /usr/local/nginx/conf/autoprotect/mojobus.co/autoprotect-mojobus.co.conf;
  root /home/nginx/domains/mojobus.co/public;

  # Cloudflare (optional)
  #include /usr/local/nginx/conf/cloudflare.conf;
  include /usr/local/nginx/conf/503include-main.conf;

  # ============================================
  # UPLOAD LIMIT (Bilder für KI-Generierung)
  # 12 Bilder × max 3MB = ~36MB → 100m als sicherer Puffer
  # ============================================
  client_max_body_size 100m;

  # ============================================
  # COMPRESSION (Gzip + Brotli)
  # ============================================

  # Gzip compression (fallback for older browsers)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    application/atom+xml
    image/svg+xml
    image/x-icon
    application/vnd.ms-fontobject
    font/truetype
    font/opentype
    font/woff
    font/woff2;

  # Brotli compression (better than gzip, ~20% more compression)
  brotli on;
  brotli_comp_level 6;
  brotli_static on;
  brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    application/atom+xml
    image/svg+xml
    image/x-icon
    application/vnd.ms-fontobject
    font/truetype
    font/opentype
    font/woff
    font/woff2;

  # ============================================
  # CACHE STRATEGIES
  # ============================================

  # HTML files (index.html) - very short cache
  location ~* \.(html|htm)$ {
    expires 5m;
    add_header Cache-Control "public, no-cache";
    add_header Pragma "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # JavaScript files (hashed by Vite) - 1 year immutable
  location ~* \.js$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";

    try_files $uri $uri/ =404;
  }

  # CSS files (hashed by Vite) - 1 year immutable
  location ~* \.css$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";

    try_files $uri $uri/ =404;
  }

  # WebP images in assets/ - 1 year immutable
  location ~* ^/assets/.*\.webp$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";

    try_files $uri $uri/ =404;
  }

  # PNG/JPG images in assets/ - 1 year immutable
  location ~* ^/assets/.*\.(png|jpg|jpeg|gif|avif)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";

    try_files $uri $uri/ =404;
  }

  # SVG images in assets/ - 1 year immutable
  location ~* ^/assets/.*\.svg$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";


    try_files $uri $uri/ =404;
  }

  # Fonts - 1 year immutable (very large, rarely changed)
  location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";
    add_header Access-Control-Allow-Origin "*";

    try_files $uri $uri/ =404;
  }

  # Favicon files - 1 year immutable
  location ~* ^/(favicon|apple-touch-icon|icon-).*\.(png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header X-Content-Type-Options "nosniff";

    try_files $uri $uri/ =404;
  }

  # _redirects file - very short cache (configuration)
  location = /_redirects {
    expires 5m;
    add_header Cache-Control "public, no-cache";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  # ============================================
  # API PROXY
  # ============================================
  location /api/ {
    proxy_pass http://127.0.0.1:3002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Große Uploads durchlassen (12 Bilder × ~3MB = ~36MB)
    client_max_body_size 100m;

    # Timeouts:
    # - Video-Generierung (Kling/Runway): 30-90s
    # - Trip-KI (8 Bilder sequentiell + Captions): bis 5 Min.
    proxy_connect_timeout  15s;
    proxy_send_timeout     360s;
    proxy_read_timeout     360s;

    # Buffer für große Requests
    proxy_request_buffering on;
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           16 16k;
    proxy_busy_buffers_size 32k;
  }

  # ============================================================
  # BOT META-TAG MIDDLEWARE
  # Erkennt Social-Media-Crawler und Suchmaschinen-Bots.
  # Leitet sie an den Node.js-Server (Port 3002) weiter,
  # der statisches HTML mit OG/Twitter/Pinterest Meta-Tags
  # direkt aus dem Nostr-Relay generiert (~100-300ms).
  #
  # Normale Besucher werden NICHT weitergeleitet → index.html
  #
  # Erkannte Bots (Auswahl):
  #   Pinterest, Google, Facebook, WhatsApp, Telegram, Twitter,
  #   Discord, Slack, LinkedIn, TikTok, Bing, ChatGPT, Claude,
  #   Perplexity, Ahrefs, SEMrush, Screaming Frog, ...
  # ============================================================

  # Bot-Erkennung via User-Agent (case-insensitive)
  map $http_user_agent $is_bot {
    default                         0;

    # ── Suchmaschinen ──────────────────────────────────
    "~*googlebot"                   1;
    "~*adsbot-google"               1;
    "~*apis-google"                 1;
    "~*google-inspectiontool"       1;
    "~*google-extended"             1;
    "~*googleother"                 1;
    "~*google page speed"           1;
    "~*bingbot"                     1;
    "~*bingpreview"                 1;
    "~*yahoo.*slurp"                1;
    "~*yandexbot"                   1;
    "~*baiduspider"                 1;
    "~*duckduckbot"                 1;
    "~*duckassistbot"               1;
    "~*applebot"                    1;
    "~*ecosia"                      1;
    "~*qwantbot"                    1;

    # ── Social Media (wichtigste!) ──────────────────────
    "~*pinterest"                   1;
    "~*pinterestbot"                1;
    "~*facebookexternalhit"         1;
    "~*facebookbot"                 1;
    "~*meta-externalagent"          1;
    "~*instagram"                   1;
    "~*whatsapp"                    1;
    "~*twitterbot"                  1;
    "~*telegrambot"                 1;
    "~*discordbot"                  1;
    "~*linkedinbot"                 1;
    "~*slackbot"                    1;
    "~*redditbot"                   1;
    "~*tiktokspider"                1;
    "~*bytespider"                  1;
    "~*tumblr"                      1;
    "~*flipboard"                   1;
    "~*skypeuripreview"             1;

    # ── KI-Bots ────────────────────────────────────────
    "~*gptbot"                      1;
    "~*chatgpt-user"                1;
    "~*oai-searchbot"               1;
    "~*claudebot"                   1;
    "~*claude-web"                  1;
    "~*anthropic-ai"                1;
    "~*perplexitybot"               1;
    "~*perplexity-user"             1;
    "~*cohere"                      1;
    "~*mistralai-user"              1;
    "~*huggingfacebot"              1;

    # ── SEO Tools ──────────────────────────────────────
    "~*ahrefsbot"                   1;
    "~*semrushbot"                  1;
    "~*screaming.frog"              1;
    "~*chrome-lighthouse"           1;
    "~*diffbot"                     1;
    "~*dotbot"                      1;
    "~*rogerbot"                    1;

    # ── Link-Preview ───────────────────────────────────
    "~*iframely"                    1;
    "~*embedly"                     1;
    "~*bitlybot"                    1;
    "~*outbrain"                    1;
    "~*w3c_validator"               1;
    "~*bufferbot"                   1;
    "~*nuzzel"                      1;
  }

  # ============================================================
  # SPA ROUTING (fallback to index.html)
  # Bots → Node.js Port 3002 (Meta-Tag HTML)
  # Normale Nutzer → index.html (React SPA)
  # ============================================================

  location / {
    # Bots: an Node.js weiterleiten
    if ($is_bot = 1) {
      proxy_pass http://127.0.0.1:3002;
    }

    # Normale Nutzer: SPA
    try_files $uri $uri/ /index.html;
  }

  # Proxy-Header für Bot-Requests zu Node.js
  # (Diese gelten wenn proxy_pass in location / greift)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Bot-Request "1";
  proxy_connect_timeout 5s;
  proxy_read_timeout    10s;

  # Enable directory listings (optional)
  #autoindex  on;
  #autoindex_localtime on;

  include /usr/local/nginx/conf/php.conf;

  # Static files includes
  include /usr/local/nginx/conf/pre-staticfiles-local-mojobus.co.conf;
  include /usr/local/nginx/conf/pre-staticfiles-global.conf;
  include /usr/local/nginx/conf/staticfiles.conf;
  include /usr/local/nginx/conf/drop.conf;

  # Error page (optional)
  #include /usr/local/nginx/conf/errorpage.conf;

  # Virtual Traffic Status (CentminMod)
  include /usr/local/nginx/conf/vts_server.conf;
}

# ============================================
# NOTES
# ============================================
#
# Cache Strategy:
# - index.html: 5 min (always fresh)
# - Assets (JS/CSS/Images): 1 year immutable (hashed filenames)
# - Fonts/Icons: 1 year immutable (large, rarely changed)
#
# Compression:
# - Gzip: Fallback for older browsers
# - Brotli: ~20% better compression than gzip
#
# Performance:
# - Conditional requests (304 responses)
# - Vary: Accept-Encoding header
# - Immutable cache for assets (never invalidates)
#
# Deployment:
# - After each deploy, browsers fetch new index.html
# - Assets are cached forever (hashes change)
# - No cache invalidation needed
#
# Service Worker:
# - index.html has short cache (5 min)
# - Assets have long cache (1 year)
# - SW and browser cache work together
#
# Upload / KI-Generierung:
# - client_max_body_size 100m (global + in /api/)
# - Trip-KI: 8 Bilder sequentiell, bis ~5 Min.
# - proxy_read_timeout 360s (statt 120s)
#
