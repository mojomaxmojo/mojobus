<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' https:">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Basic SEO Meta Tags -->
    <meta name="description" content="MojoBus - Perpetual Traveler Blog. Unser Leben am Meer, vanlife, offgrid und Reisen. Geschichten, Tipps und Einblicke vom Strand.">
    <meta name="keywords" content="perpetual traveler, vanlife, offgrid, beachlife, reisen, camping, meer, strand, mobiles leben, nomaden, schweiz, deutschland,">
    <meta name="author" content="Mojo" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mojobus.org/" />
    <meta property="og:title" content="MojoBus - Perpetual Traveler Blog" />
    <meta property="og:description" content="Unser Leben am Meer. Vanlife, offgrid und Geschichten vom Strand. Perpetual Traveler Lifestyle mit Leon (Lionhunter)." />
    <meta property="og:image" content="https://mojobus.org/mojobuslogo.png" />
    <meta property="og:image:alt" content="MojoBus Logo - Perpetual Traveler" />
    <meta property="og:site_name" content="MojoBus Blog" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mojobus.org/" />
    <meta property="twitter:title" content="MojoBus - Perpetual Traveler Blog" />
    <meta property="twitter:description" content="Unser Leben am Meer. Vanlife, offgrid und Geschichten vom Strand. 🌊🚐✨" />
    <meta property="twitter:image" content="https://mojobus.org/mojobuslogo.png" />
    <meta property="twitter:image:alt" content="MojoBus Logo - Perpetual Traveler" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://mojobus.org/" />
    <meta name="theme-color" content="#0891B2" />
    <meta name="msapplication-TileColor" content="#0891B2" />
    <meta name="msapplication-TileImage" content="/icon-512x512.png" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="72x72" href="/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon-128x128.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/icon-144x144.png" />
    <link rel="icon" type="image/png" sizes="152x152" href="/icon-152x152.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icon-256x256.png" />
    <link rel="icon" type="image/png" sizes="384x384" href="/icon-384x384.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon-512x512.png" color="#0891B2" />

    <!-- 🔥 PERFORMANCE: Critical Preloading für bessere Ladezeit -->
    <!-- DNS-Prefetch für externe Ressourcen -->
    <link rel="dns-prefetch" href="https://images.weserv.nl" />
    <link rel="dns-prefetch" href="https://blossom.primal.net" />
    <link rel="dns-prefetch" href="https://relay.mojobus.co" />
    <link rel="dns-prefetch" href="https://relays.mojobus.co" />

    <!-- Preconnect für kritische externe Ressourcen (TCP-Handshake vorab) -->
    <link rel="preconnect" href="https://blossom.primal.net" />
    <link rel="preconnect" href="https://relay.mojobus.co" />
    <link rel="preconnect" href="https://relays.mojobus.co" />
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin />

    <!-- Preload kritische Assets -->
    <link rel="preload" href="/icon-192x192.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/icon-512x512.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/icon-256x256.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/mojobuslogo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/apple-touch-icon.png" as="image" type="image/png" fetchpriority="high" />

    <!-- Fonts: Inter via Google Fonts, Playfair Display self-hosted -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" href="/fonts.css" as="style" />
    <link rel="stylesheet" href="/fonts.css" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('Service Worker registered:', registration);
            })
            .catch(error => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>

    <!-- Self-hosted Fonts werden über fonts.css geladen -->

    <!-- Favicon -->
    <!-- Note: Favicon & App Icons are already declared above -->

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "MojoBus",
      "description": "Perpetual Traveler Blog. Unser Leben am Meer, vanlife, offgrid und Reisen.",
      "url": "https://mojobus.org/",
      "author": {
        "@type": "Person",
        "name": "Mojo",
        "url": "https://mojobus.org/"
      },
      "publisher": {
        "@type": "Organization",
        "name": "MojoBus",
        "logo": {
          "@type": "ImageObject",
          "url": "https://mojobus.org/mojobuslogo.png"
        }
      },
      "inLanguage": "de-DE",
      "about": [
        "Vanlife",
        "Perpetual Travel",
        "Offgrid Living",
        "Beach Life",
        "Camping",
        "Travel Blog"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 🔥 CRITICAL: Node.js polyfills MUST load synchronously before ALL other scripts -->
    <script>
    if(typeof globalThis==="undefined"){self.globalThis=self;}
    if(typeof process==="undefined"){self.process={env:"",version:"",nextTick:function(fn){return setTimeout(fn,0);},cwd:function(){return"/";},platform:"browser",browser:true};}
    if(typeof require==="undefined"){var cache={};self.require=function(id){console.warn("[Polyfill] require():",id);return cache[id];};self.require.cache=cache;self.require.resolve=function(id){return id;};self.require.extensions={};}
    if(typeof module==="undefined"){self.module={exports:{},children:[],parent:null};}
    if(typeof exports==="undefined"){self.exports={};}
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
